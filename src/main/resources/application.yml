data-station:
  fdp-url: ${FDS_FDP_URL:http://fdp}
  # Authentication of incoming train dispatches. When enabled, POST /trains is
  # only accepted from a handler on allowed-handlers with a valid Ed25519
  # signature. Populate allowed-handlers via the mounted config / env.
  dispatch:
    enabled: ${FDS_DISPATCH_ENABLED:false}
    max-clock-skew-seconds: ${FDS_DISPATCH_MAX_SKEW:300}
    # Refuse a dispatch from a handler that declares no allowed-callback-hosts.
    # Off by default so existing allow-lists keep working; a handler entry may
    # carry allowed-callback-hosts: [host, host:port, "*.suffix"] to constrain
    # where its results may be delivered.
    require-callback-allow-list: ${FDS_DISPATCH_REQUIRE_CALLBACK_ALLOW_LIST:false}
    allowed-handlers: []
  # Bounds on the outbound requests made while resolving a train. The URIs come
  # from the dispatching handler, so they are attacker-influenced.
  fetch:
    enabled: ${FDS_FETCH_GUARD_ENABLED:true}
    # Loopback and link-local are refused by default: no train URI legitimately
    # names one, and 169.254.169.254 is the cloud instance-metadata endpoint.
    allow-loopback-addresses: ${FDS_FETCH_ALLOW_LOOPBACK:false}
    # Private ranges stay reachable by default because the reference compose
    # deployment puts the FAIR Data Point on a container network. Set false in
    # production and pair it with an explicit allowed-hosts list.
    allow-private-addresses: ${FDS_FETCH_ALLOW_PRIVATE:true}
    max-bytes: ${FDS_FETCH_MAX_BYTES:16777216}
    allowed-schemes: [http, https]
    allowed-hosts: []
  # Signing of outgoing job event / artifact callbacks, so the handler can
  # authenticate this station's results. Off by default because it requires the
  # handler to hold this station's public key (station.public_key).
  callback:
    enabled: ${FDS_CALLBACK_SIGNING_ENABLED:false}
    identity: ${FDS_CALLBACK_SIGNING_IDENTITY:}
    private-key: ${FDS_CALLBACK_SIGNING_PRIVATE_KEY:}
  # Authorization policy for the queries a train may run against this station.
  # On by default (read-only, no federation); set FDS_POLICY_ENABLED=false to opt out.
  policy:
    enabled: ${FDS_POLICY_ENABLED:true}
    sparql:
      allow-updates: ${FDS_POLICY_ALLOW_UPDATES:false}
      allow-federation: ${FDS_POLICY_ALLOW_FEDERATION:false}
      max-query-length: ${FDS_POLICY_MAX_QUERY_LENGTH:100000}
      allowed-query-types: [SELECT, ASK, CONSTRUCT, DESCRIBE]
      denied-patterns: []
  storages:
    triple-store:
      # valid repository type options {1 = inMemoryStore, 2 = NativeStore, 3 = AllegroGraph, 4 = graphDB, 5 = blazegraph}
      type: ${FDS_TRIPLE_STORE_TYPE:1}
      native:
        dir: ${FDS_TRIPLE_STORE_DIR:/tmp/fdp-store/}
      agraph:
        url: ${FDS_TRIPLE_STORE_URL:http://localhost:10035/repositories/fdp}
        username: ${FDS_TRIPLE_STORE_USERNAME:user}
        password: ${FDS_TRIPLE_STORE_PASSWORD:password}
      graphDb:
        url: ${FDS_TRIPLE_STORE_URL:http://localhost:7200}
        repository: ${FDS_TRIPLE_STORE_REPOSITORY:test}
        username: ${FDS_TRIPLE_STORE_USERNAME:user}
        password: ${FDS_TRIPLE_STORE_PASSWORD:password}
      blazegraph:
        url: ${FDS_TRIPLE_STORE_URL:http://localhost:8888/blazegraph}
        repository: ${FDS_TRIPLE_STORE_REPOSITORY:test}
  apis:
    fhir:
      base: ${FDS_FHIR_BASE_URL}


spring:
  application:
    name: fair-data-station
  task:
    scheduling:
      pool:
        size: 2
  main:
    banner-mode: off
    web-application-type: reactive
  datasource:
    url: jdbc:postgresql://${FDS_POSTGRES_HOST:postgres}:${FDS_POSTGRES_PORT:5432}/${FDS_POSTGRES_DB:fds}
    username: ${FDS_POSTGRES_USERNAME:postgres}
    password: ${FDS_POSTGRES_PASSWORD:password}
  flyway:
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        ddl-auto: validate
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
      enabled: true

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: alpha
  webjars:
    prefix: ''

management:
  health:
    solr:
      enabled:  false
  info:
    defaults:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, gateway
      cors:
        allowed-origins: "*"
        allowed-methods: "GET"
